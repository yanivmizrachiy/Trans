name: Validate transformation site integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Build outputs are not in Git; the build workflow checks them after building.
      CHECK_BUILT_PDFS: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check JavaScript syntax
        run: |
          for f in assets/*.js; do node --check "$f"; done
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for filename in ("index.html", "book/complete.html"):
              html = Path(filename).read_text(encoding="utf-8")
              blocks = re.findall(r"<script[^>]*>([\s\S]*?)</script>", html)
              assert blocks, f"Missing JavaScript in {filename}"
              for block in blocks:
                  subprocess.run(["node", "--check"], input=block, text=True, check=True)
              print(f"{filename}: {len(blocks)} JavaScript blocks syntactically valid")
          PY
      - name: Check the geometry of the original questions
        run: python3 scripts/test_math.py
      - name: Verify transformation identities against an independent complex-plane model
        run: python3 scripts/test_properties.py
      - name: Check links, wording and PDFs
        run: python3 scripts/validate_site.py
      - name: Install the PDF reader
        run: python3 -m pip install --disable-pip-version-check pypdf
      - name: Check the source of truth and the credits
        run: python3 scripts/check_contract.py
      - name: Check every inventory consumer against data/manifest.json
        run: python3 scripts/check_manifest.py
      - name: Check the printed answers against the worksheet coordinates
        run: python3 scripts/test_answer_keys.py
      - name: Audit the original worksheets and their answer keys
        run: python3 scripts/test_pedagogy.py
      - name: Test the publication step
        run: python3 scripts/test_publish_pdfs.py
