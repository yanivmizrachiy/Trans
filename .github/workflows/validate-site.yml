name: Validate transformation site integrity
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'original.html'
      - 'curriculum.html'
      - 'teacher.html'
      - 'explore.html'
      - 'worksheets/**'
      - 'assets/**'
      - 'pdf/**'
      - 'scripts/validate_site.py'
      - 'scripts/test_math.py'
      - 'scripts/test_properties.py'
      - 'scripts/test_pedagogy.py'
      - 'scripts/test_answer_keys.py'
      - 'scripts/sync_teacher_answers.py'
      - 'scripts/check_contract.py'
      - 'SOURCE_OF_TRUTH.md'
      - 'README.md'
      - 'book/INTRO.md'
      - 'book/transformations-complete.pdf'
      - 'book/teacher.pdf'
      - 'book/official.pdf'
      - '.github/workflows/validate-site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check geometry script and homepage JavaScript syntax
        run: |
          node --check assets/original-grid.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for filename in ("index.html", "explore.html"):
              html = Path(filename).read_text(encoding="utf-8")
              blocks = re.findall(r"<script[^>]*>([\s\S]*?)</script>", html)
              assert blocks, f"Missing JavaScript in {filename}"
              for block in blocks:
                  subprocess.run(["node", "--check"], input=block, text=True, check=True)
              print(f"{filename}: {len(blocks)} JavaScript blocks syntactically valid")
          PY
      - name: Independently test math and teacher-answer assumptions
        run: python3 scripts/test_math.py
      - name: Verify transformation identities against an independent complex-plane model
        run: python3 scripts/test_properties.py
      - name: Check exact source inventory, PDFs and author credits
        run: python3 scripts/validate_site.py
      - name: Install PDF reader for independent documentation consistency check
        run: python3 -m pip install --disable-pip-version-check pypdf
      - name: Enforce the single up-to-date source of truth and real artifact inventory
        run: python3 scripts/check_contract.py
      - name: Check numerical answers printed for all 33 original question levels
        run: python3 scripts/test_answer_keys.py
      - name: Prevent teacher website solutions from drifting from the canonical answer key
        run: python scripts/sync_teacher_answers.py --check
      - name: Check all three difficulty levels and the teacher's answer keys
        run: python3 scripts/test_pedagogy.py
