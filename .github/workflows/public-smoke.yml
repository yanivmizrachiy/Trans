name: Public website HTTP and binary integrity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/original.css'
      - 'pdf/**'
      - 'book/*.pdf'
      - 'book/*.html'
      - 'scripts/test_public_http.py'
      - '.github/workflows/public-smoke.yml'
  workflow_run:
    workflows: ['Build printable transformation PDFs']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: trans-public-smoke
  cancel-in-progress: true
jobs:
  public:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Verify all public URLs against exact committed bytes
        run: python scripts/test_public_http.py
