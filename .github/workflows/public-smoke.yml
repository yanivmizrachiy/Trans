name: Public website HTTP and binary integrity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/test_public_http.py'
      - 'scripts/test_public_browser.py'
      - '.github/workflows/public-smoke.yml'
  workflow_run:
    workflows: ['Build printable transformation PDFs']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: trans-public-smoke
  cancel-in-progress: true
jobs:
  public:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Verify all public URLs against exact committed bytes
        run: python scripts/test_public_http.py
      - name: Install Chromium for independent mobile-browser testing
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Exercise the live public Hebrew RTL interface and transformation lab
        run: python scripts/test_public_browser.py
      - name: Preserve actual mobile screenshots for human inspection
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: transformation-public-mobile-screenshots
          path: qa/public-browser/*.png
          if-no-files-found: warn
          retention-days: 30
