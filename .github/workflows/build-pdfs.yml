name: Build printable transformation PDFs
on:
  push:
    branches: [main]
    paths:
      - 'worksheets/**'
      - 'assets/**'
      - 'scripts/build_pdfs.py'
      - 'scripts/test_math.py'
      - 'scripts/validate_site.py'
      - '.github/workflows/build-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: transformations-pdfs-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF rendering and verification
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Check all original geometry questions and solutions
        run: python scripts/test_math.py
      - name: Render real worksheets to PDF
        run: python scripts/build_pdfs.py
      - name: Check paths, authorship, file counts and valid PDFs
        run: python scripts/validate_site.py
      - name: Commit verified PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/
          if git diff --cached --quiet; then
            echo "All PDF files already match the worksheet sources."
          else
            git commit -m "Generate printable A4 PDFs from transformation worksheets [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              if git diff --name-only HEAD origin/main -- worksheets/ assets/ scripts/build_pdfs.py | grep -q .; then
                echo "Source worksheets changed during PDF build; refusing to publish stale PDFs."
                exit 1
              fi
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then echo "Push failed after retries"; exit 1; fi
            done
          fi
