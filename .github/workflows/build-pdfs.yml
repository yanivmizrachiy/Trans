name: Build printable transformation PDFs
on:
  push:
    branches: [main]
    paths:
      - 'worksheets/**'
      - 'assets/**'
      - 'scripts/build_pdfs.py'
      - 'book/teacher.html'
      - 'scripts/build_teacher.py'
      - 'scripts/test_math.py'
      - 'scripts/validate_site.py'
      - '.github/workflows/build-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: transformations-pdfs-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF rendering and verification
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Check all original geometry questions and solutions
        run: python scripts/test_math.py
      - name: Render real worksheets to PDF
        run: python scripts/build_pdfs.py
      - name: Render and strictly validate fourteen teacher summary pages
        run: python scripts/build_teacher.py
      - name: Check paths, authorship, file counts and valid PDFs
        run: python scripts/validate_site.py
      - name: Publish PDFs only when sources are still current
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE="$(git rev-parse HEAD)"
          TEMP="$(mktemp -d)"
          cp pdf/*.pdf "$TEMP/"
          cp book/teacher.pdf "$TEMP/teacher.pdf"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$BASE" origin/main -- worksheets/ assets/ scripts/build_pdfs.py book/teacher.html scripts/build_teacher.py; then
              echo "A newer commit changed PDF source files. This build is superseded; publishing nothing."
              exit 0
            fi
            if ! git diff --quiet "$BASE" origin/main -- pdf/ book/teacher.pdf; then
              echo "Another run has already published PDFs for this source revision. Avoiding binary conflicts."
              exit 0
            fi
            git reset --hard origin/main
            for file in pdf/*.pdf; do cp "$TEMP/$(basename "$file")" "$file"; done
            cp "$TEMP/teacher.pdf" book/teacher.pdf
            git add pdf/ book/teacher.pdf
            if git diff --cached --quiet; then
              echo "All deployed PDFs already match the generated files."
              exit 0
            fi
            git commit -m "Generate verified transformation PDFs [skip ci]"
            if git push origin HEAD:main; then
              echo "Verified PDF publication succeeded."
              exit 0
            fi
            echo "Branch advanced concurrently; retrying on fresh main."
          done
          echo "PDF publication could not safely advance main after three retries."
          exit 1
