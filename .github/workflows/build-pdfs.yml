name: Build printable transformation PDFs
on:
  push:
    branches: [main]
    paths:
      - 'worksheets/**'
      - 'assets/**'
      - 'scripts/build_pdfs.py'
      - 'book/teacher.html'
      - 'scripts/build_teacher.py'
      - 'book/official.html'
      - 'sources/ministry/**'
      - 'scripts/build_official.py'
      - 'book/front.html'
      - 'book/sadna.html'
      - 'scripts/build_complete.py'
      - 'scripts/visual_audit.py'
      - 'docs/ANSWER_KEY.md'
      - 'docs/PRESENTATION_2026-10-21.md'
      - 'scripts/test_math.py'
      - 'scripts/test_properties.py'
      - 'scripts/test_pedagogy.py'
      - 'scripts/test_answer_keys.py'
      - 'scripts/sync_teacher_answers.py'
      - 'scripts/validate_site.py'
      - '.github/workflows/build-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: transformations-pdfs-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install PDF rendering and verification
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf pillow reportlab markdown pymupdf
          python -m playwright install --with-deps chromium
      - name: Check all original geometry questions and solutions
        run: python scripts/test_math.py
      - name: Verify transformation identities against an independent complex-plane model
        run: python3 scripts/test_properties.py
      - name: Independently audit all 33 graded original prompts and teacher keys
        run: python scripts/test_pedagogy.py
      - name: Verify all 33 actual printed numerical answer-key levels against worksheet coordinates
        run: python scripts/test_answer_keys.py
      - name: Prevent teacher website solutions from drifting from the canonical answer key
        run: python scripts/sync_teacher_answers.py --check
      - name: Render real worksheets to PDF
        run: python scripts/build_pdfs.py
      - name: Render and strictly validate fourteen teacher summary pages
        run: python scripts/build_teacher.py
      - name: Verify and render eight unchanged ministry curriculum pages
        run: python scripts/build_official.py
      - name: Build full multi-part transformation book with bookmarks and teacher answers
        run: python scripts/build_complete.py
      - name: Independently raster-audit all fifty-one A4 pages and create visual contact sheets
        run: python scripts/visual_audit.py
      - name: Check paths, authorship, file counts and valid PDFs
        run: python scripts/validate_site.py
      - name: Publish PDFs only when sources are still current
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE="$(git rev-parse HEAD)"
          TEMP="$(mktemp -d)"
          cp pdf/*.pdf "$TEMP/"
          cp book/teacher.pdf "$TEMP/teacher.pdf"
          cp book/official.pdf "$TEMP/official.pdf"
          for name in front workshop sadna answers transformations-complete; do cp "book/$name.pdf" "$TEMP/$name.pdf"; done
          cp book/workshop.html book/answers.html "$TEMP/"
          mkdir -p "$TEMP/previews"
          cp qa/previews/*.jpg "$TEMP/previews/"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$BASE" origin/main -- worksheets/ assets/ scripts/build_pdfs.py book/teacher.html scripts/build_teacher.py book/official.html sources/ministry/ scripts/build_official.py book/front.html book/sadna.html scripts/build_complete.py scripts/visual_audit.py docs/ANSWER_KEY.md docs/PRESENTATION_2026-10-21.md; then
              echo "A newer commit changed PDF source files. This build is superseded; publishing nothing."
              exit 0
            fi
            if ! git diff --quiet "$BASE" origin/main -- pdf/ book/teacher.pdf book/official.pdf book/front.pdf book/workshop.pdf book/answers.pdf book/transformations-complete.pdf book/workshop.html book/answers.html qa/previews/; then
              echo "Another run has already published PDFs for this source revision. Avoiding binary conflicts."
              exit 0
            fi
            git reset --hard origin/main
            for file in pdf/*.pdf; do cp "$TEMP/$(basename "$file")" "$file"; done
            cp "$TEMP/teacher.pdf" book/teacher.pdf
            cp "$TEMP/official.pdf" book/official.pdf
            for name in front workshop sadna answers transformations-complete; do cp "$TEMP/$name.pdf" "book/$name.pdf"; done
            cp "$TEMP/workshop.html" "$TEMP/answers.html" book/
            mkdir -p qa/previews
            cp "$TEMP/previews/"*.jpg qa/previews/
            git add pdf/ book/teacher.pdf book/official.pdf book/front.pdf book/workshop.pdf book/answers.pdf book/transformations-complete.pdf book/workshop.html book/answers.html qa/previews/
            if git diff --cached --quiet; then
              echo "All deployed PDFs already match the generated files."
              exit 0
            fi
            git commit -m "Generate verified transformation PDFs [skip ci]"
            if git push origin HEAD:main; then
              echo "Verified PDF publication succeeded."
              exit 0
            fi
            echo "Branch advanced concurrently; retrying on fresh main."
          done
          echo "PDF publication could not safely advance main after three retries."
          exit 1
