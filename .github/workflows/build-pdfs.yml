name: Build printable transformation PDFs
on:
  push:
    branches: [main]
    paths:
      - 'worksheets/**'
      - 'data/manifest.json'
      - 'scripts/manifest.py'
      - 'scripts/check_manifest.py'
      - 'scripts/sync_book_docs.py'
      - 'assets/**'
      - 'scripts/build_pdfs.py'
      - 'book/teacher.html'
      - 'teacher.html'
      - 'scripts/build_teacher.py'
      - 'book/official.html'
      - 'sources/ministry/**'
      - 'scripts/build_official.py'
      - 'book/complete.html'
      - 'book/INTRO.md'
      - 'book/sadna.html'
      - 'book/krispin-video.html'
      - 'scripts/build_complete.py'
      - 'scripts/visual_audit.py'
      - 'docs/ANSWER_KEY.md'
      - 'docs/TEACHER_WORKSHOP.md'
      - 'scripts/test_math.py'
      - 'scripts/test_properties.py'
      - 'scripts/test_pedagogy.py'
      - 'scripts/test_answer_keys.py'
      - 'scripts/sync_teacher_answers.py'
      - 'scripts/validate_site.py'
      - 'scripts/publish_pdfs.sh'
      - '.github/workflows/build-pdfs.yml'
  pull_request:
    paths:
      - 'worksheets/**'
      - 'assets/**'
      - 'book/*.html'
      - 'sources/ministry/**'
      - 'docs/ANSWER_KEY.md'
      - 'docs/TEACHER_WORKSHOP.md'
      - 'scripts/**'
      - '.github/workflows/build-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: transformations-pdfs-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install PDF rendering and verification
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf pillow reportlab markdown pymupdf
          python -m playwright install --with-deps chromium
      - name: Check all original geometry questions and solutions
        run: python scripts/test_math.py
      - name: Verify transformation identities against an independent complex-plane model
        run: python3 scripts/test_properties.py
      - name: Independently audit all 33 graded original prompts and teacher keys
        run: python scripts/test_pedagogy.py
      - name: Verify all 33 actual printed numerical answer-key levels against worksheet coordinates
        run: python scripts/test_answer_keys.py
      - name: Prevent teacher website solutions from drifting from the canonical answer key
        run: python scripts/sync_teacher_answers.py --check
      - name: Render real worksheets to PDF
        run: python scripts/build_pdfs.py
      - name: Render and strictly validate fourteen teacher summary pages
        run: python scripts/build_teacher.py
      - name: Verify and render the unchanged ministry curriculum pages listed in the manifest
        run: python scripts/build_official.py
      - name: Build full multi-part transformation book with bookmarks and teacher answers
        run: python scripts/build_complete.py
      - name: Independently raster-audit every booklet page including the landscape source pages
        run: python scripts/visual_audit.py
      - name: Check paths, authorship, file counts and valid PDFs
        run: python scripts/validate_site.py
      - name: Check every inventory consumer against data/manifest.json
        run: python scripts/check_manifest.py
      - name: Prove the publication step publishes new PDFs and survives concurrent pushes
        run: python scripts/test_publish_pdfs.py
      - name: Publish PDFs only when sources are still current
        if: github.event_name != 'pull_request'
        env:
          PUBLISH_CONFIRM: "1"
          PUBLISH_REMOTE: origin
          PUBLISH_BRANCH: main
        run: bash scripts/publish_pdfs.sh
