name: Build printable transformation PDFs
# Push and pull_request watch the same sources: everything the booklet is built from.
on:
  push:
    branches: [main]
    paths:
      - 'worksheets/**'
      - 'data/**'
      - 'assets/**'
      - 'book/*.html'
      - 'sources/ministry/**'
      - 'docs/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/build-pdfs.yml'
  pull_request:
    paths:
      - 'worksheets/**'
      - 'data/**'
      - 'assets/**'
      - 'book/*.html'
      - 'sources/ministry/**'
      - 'docs/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/build-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: transformations-pdfs-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install PDF rendering and verification
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check the geometry of the original questions
        run: python scripts/test_math.py
      - name: Verify transformation identities against an independent complex-plane model
        run: python3 scripts/test_properties.py
      - name: Audit the original worksheets and their answer keys
        run: python scripts/test_pedagogy.py
      - name: Check the printed answers against the worksheet coordinates
        run: python scripts/test_answer_keys.py
      - name: Render real worksheets to PDF
        run: python scripts/build_pdfs.py
      - name: Render the teacher summaries
        run: python scripts/build_teacher.py
      - name: Render the curriculum pages
        run: python scripts/build_official.py
      - name: Build the booklet
        run: python scripts/build_complete.py
      - name: Audit every booklet page
        run: python scripts/visual_audit.py
      - name: Check links, wording and PDFs
        run: python scripts/validate_site.py
      - name: Check every inventory consumer against data/manifest.json
        run: python scripts/check_manifest.py
      - name: Test the publication step
        run: python scripts/test_publish_pdfs.py
      # Temporary print-proof artifact for PR #85; PR #75 has the permanent audit upload.
      - name: Save PDF and page previews for mathematical visual verification
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/verified-transformations-geometry-20261119'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: transformations-geometry-print-proof
          path: |
            book/transformations-complete.pdf
            qa/previews/*.jpg
          if-no-files-found: error
          retention-days: 3
      - name: Publish the booklet only when sources are still current
        if: github.event_name != 'pull_request'
        env:
          PUBLISH_CONFIRM: "1"
          PUBLISH_REMOTE: origin
          PUBLISH_BRANCH: main
        run: bash scripts/publish_pdfs.sh
