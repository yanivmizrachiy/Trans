<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="חוברת טרנספורמציות וחפיפת צורות: כל עמודי חוברת ה־A4 ברצף אחד.">
<title>טרנספורמציות וחפיפת צורות</title>
<style>
html,body{margin:0;background:#fff;-webkit-text-size-adjust:100%}
html{overflow-x:hidden}
body{overflow-x:clip}
.bar{position:sticky;top:0;z-index:2;display:flex;justify-content:center;padding:8px 16px;background:#fff}
.get{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;background:#0b3a75;color:#fff;font:700 16px/1 Arial,"Noto Sans Hebrew",sans-serif;text-decoration:none;white-space:nowrap}
.get:active{background:#082a56}
.load{position:absolute;right:0;bottom:0;height:4px;width:0;background:#0b3a75;transition:width .3s}
@media print{.bar{display:none}}
.book{max-width:980px;margin:0 auto;background:#fff}
.page{position:relative;width:100%;background:#fff}
.page::after{content:"";display:block;position:absolute;left:0;right:0;bottom:0;height:4px;background:#c2185b}
.page:last-child::after{display:none}
.page:last-child{border-bottom:0}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fallback{display:block;width:100%;height:100vh;border:0;background:#fff}
</style>
</head>
<body>
<div class="bar"><div class="load" id="load"></div><a class="get" href="transformations-complete.pdf" download="transformations-complete.pdf">הורדת החוברת להדפסה (PDF, A4)</a></div>
<main class="book" id="book" aria-label="חוברת טרנספורמציות וחפיפת צורות"></main>
<noscript><iframe class="fallback" src="transformations-complete.pdf" title="חוברת טרנספורמציות וחפיפת צורות"></iframe></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
"use strict";
// The reading view shows the printed A4 booklet itself, page after page, with nothing added.
const PDF="transformations-complete.pdf";
const BOOK=document.getElementById("book");
function fallback(){BOOK.innerHTML="";const f=document.createElement("iframe");f.className="fallback";f.src=PDF;f.title="חוברת טרנספורמציות וחפיפת צורות";BOOK.appendChild(f);}
async function show(){
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const task=pdfjsLib.getDocument({url:PDF,disableAutoFetch:true}),load=document.getElementById("load");
  task.onProgress=p=>{if(p.total)load.style.width=Math.min(100,100*p.loaded/p.total)+"%";};
  const doc=await task.promise;
  const slots=[];
  for(let n=1;n<=doc.numPages;n++){
    const page=await doc.getPage(n);
    const box=page.getViewport({scale:1});
    const slot=document.createElement("div");slot.className="page";slot.id="page-"+n;
    slot.style.aspectRatio=box.width+" / "+box.height;
    slot.setAttribute("role","img");slot.setAttribute("aria-label","עמוד "+n);
    BOOK.appendChild(slot);slots.push([slot,page]);
  }
  const drawn=new WeakMap();
  const draw=async(slot,page)=>{
    const width=slot.clientWidth;if(!width)return;const ratio=Math.min(2,window.devicePixelRatio||1);
    if(drawn.get(slot)===width)return;drawn.set(slot,width);
    const view=page.getViewport({scale:width*ratio/page.getViewport({scale:1}).width});
    const canvas=document.createElement("canvas");canvas.width=Math.ceil(view.width);canvas.height=Math.ceil(view.height);
    await page.render({canvasContext:canvas.getContext("2d"),viewport:view}).promise;
    slot.replaceChildren(canvas);
  };
  const pages=new Map(slots);
  load.remove();
  const watch=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting)draw(e.target,pages.get(e.target)).catch(()=>{});},{rootMargin:"1600px 0px"});
  slots.forEach(([slot])=>watch.observe(slot));
  addEventListener("resize",()=>{for(const [slot,page] of slots){const r=slot.getBoundingClientRect();if(r.bottom>-1600&&r.top<innerHeight+1600)draw(slot,page).catch(()=>{});}});
}
if(window.pdfjsLib)show().catch(fallback);else fallback();
</script>
</body>
</html>
