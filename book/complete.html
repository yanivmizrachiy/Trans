<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="חוברת טרנספורמציות וחפיפת צורות: כל עמודי חוברת ה־A4 ברצף אחד.">
<title>טרנספורמציות וחפיפת צורות</title>
<style>
html,body{margin:0;background:#dfe4ea;-webkit-text-size-adjust:100%}
html{overflow-x:hidden}
body{overflow-x:clip}
.bar{position:sticky;top:0;z-index:2;display:flex;justify-content:center;padding:8px 16px;background:#fff}
.get{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;background:#0b3a75;color:#fff;font:700 16px/1 Arial,"Noto Sans Hebrew",sans-serif;text-decoration:none;white-space:nowrap}
.get:active{background:#082a56}
.load{position:absolute;right:0;bottom:0;height:4px;width:0;background:#0b3a75;transition:width .3s}
@media print{.bar{display:none}html,body{background:#fff}}
.book{max-width:210mm;margin:0 auto;background:#fff}
.page{position:relative;width:100%;background:#fff}
.page::after{content:"";display:block;position:absolute;left:0;right:0;bottom:0;height:4px;background:#c2185b}
.page:last-child::after{display:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fallback{display:block;width:100%;height:100vh;border:0;background:#fff}
</style>
</head>
<body>
<div class="bar"><div class="load" id="load"></div><a class="get" href="transformations-complete.pdf" download="transformations-complete.pdf">הורדת החוברת להדפסה (PDF, A4)</a></div>
<main class="book" id="book" aria-label="חוברת טרנספורמציות וחפיפת צורות"></main>
<noscript><iframe class="fallback" src="transformations-complete.pdf" title="חוברת טרנספורמציות וחפיפת צורות"></iframe></noscript>
<script>
"use strict";
// Keep the viewer library and worker on one pinned, supported release.
const PDFJS_BASE="https://cdn.jsdelivr.net/npm/pdfjs-dist@6.5.438/build/";
const PDF="transformations-complete.pdf";
const BOOK=document.getElementById("book");
function fallback(){
  BOOK.replaceChildren();
  const frame=document.createElement("iframe");
  frame.className="fallback";
  frame.src=PDF;
  frame.title="חוברת טרנספורמציות וחפיפת צורות";
  BOOK.appendChild(frame);
}
async function show(pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+"pdf.worker.mjs";
  const load=document.getElementById("load");
  const task=pdfjsLib.getDocument({url:PDF,disableAutoFetch:true,isEvalSupported:false});
  task.onProgress=p=>{if(load&&p.total)load.style.width=Math.min(100,100*p.loaded/p.total)+"%";};
  const doc=await task.promise;
  const first=await doc.getPage(1);
  const viewport=first.getViewport({scale:1});
  const pages=new Map();
  const rendered=new WeakMap();
  const active=new WeakMap();
  const attempts=new WeakMap();
  const slots=[];
  for(let n=1;n<=doc.numPages;n++){
    const slot=document.createElement("div");
    slot.className="page";
    slot.id="page-"+n;
    slot.style.aspectRatio=viewport.width+" / "+viewport.height;
    slot.setAttribute("role","img");
    slot.setAttribute("aria-label","עמוד "+n);
    BOOK.appendChild(slot);
    slots.push([slot,n]);
  }
  if(load)load.remove();
  async function draw(slot,n){
    if(!slot.isConnected)return;
    const width=Math.round(slot.getBoundingClientRect().width);
    if(!width)return;
    const ratio=Math.min(2.5,Math.max(1,window.devicePixelRatio||1));
    const key=width+"/"+ratio;
    if(rendered.get(slot)===key||active.get(slot)===key)return;
    active.set(slot,key);
    try{
      if(!pages.has(n))pages.set(n,doc.getPage(n));
      const page=await pages.get(n);
      const view=page.getViewport({scale:width*ratio/page.getViewport({scale:1}).width});
      const canvas=document.createElement("canvas");
      canvas.width=Math.ceil(view.width);
      canvas.height=Math.ceil(view.height);
      const context=canvas.getContext("2d",{alpha:false});
      if(!context)throw new Error("Canvas is unavailable");
      await page.render({canvasContext:context,viewport:view}).promise;
      if(active.get(slot)!==key||!slot.isConnected||Math.abs(slot.getBoundingClientRect().width-width)>1)return;
      slot.replaceChildren(canvas);
      rendered.set(slot,key);
      attempts.delete(slot);
    }catch(error){
      console.warn("Unable to draw booklet page",n,error);
      if(active.get(slot)===key){
        const retry=(attempts.get(slot)||0)+1;
        attempts.set(slot,retry);
        if(retry<=2)setTimeout(()=>draw(slot,n),1200*retry);
        else fallback();
      }
    }finally{
      if(active.get(slot)===key)active.delete(slot);
    }
  }
  const visible=()=>slots.filter(([slot])=>{
    const r=slot.getBoundingClientRect();
    return r.bottom>-1600&&r.top<innerHeight+1600;
  });
  const watch=new IntersectionObserver(entries=>{
    for(const entry of entries)if(entry.isIntersecting){
      const n=Number(entry.target.id.slice(5));
      draw(entry.target,n);
    }
  },{rootMargin:"1600px 0px"});
  slots.forEach(([slot])=>watch.observe(slot));
  const redraw=()=>visible().forEach(([slot,n])=>draw(slot,n));
  addEventListener("resize",redraw);
  if("ResizeObserver" in window)new ResizeObserver(redraw).observe(BOOK);
}
import(PDFJS_BASE+"pdf.mjs").then(show).catch(error=>{
  console.warn("PDF preview unavailable; falling back to native PDF viewer",error);
  fallback();
});
</script>
</body>
</html>
