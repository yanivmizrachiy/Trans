<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="חוברת טרנספורמציות וחפיפת צורות: כל עמודי חוברת ה־A4 ברצף אחד.">
<title>טרנספורמציות וחפיפת צורות</title>
<style>
html,body{margin:0;background:#dfe4ea;-webkit-text-size-adjust:100%}
html{overflow-x:hidden}
body{overflow-x:clip}
.bar{position:sticky;top:0;z-index:2;display:flex;justify-content:center;padding:8px 16px;background:#fff}
.get{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;background:#0b3a75;color:#fff;font:700 16px/1 Arial,"Noto Sans Hebrew",sans-serif;text-decoration:none;white-space:nowrap}
.get:active{background:#082a56}
.load{position:absolute;right:0;bottom:0;height:4px;width:0;background:#0b3a75;transition:width .3s}
@media print{.bar{display:none}html,body{background:#fff}}
.book{max-width:210mm;margin:0 auto;background:#fff}
.page{position:relative;width:100%;background:#fff}
.page::after{content:"";display:block;position:absolute;left:0;right:0;bottom:0;height:4px;background:#c2185b}
.page:last-child::after{display:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fallback{display:block;width:100%;height:100vh;border:0;background:#fff}
</style>
</head>
<body>
<div class="bar"><div class="load" id="load"></div><a class="get" href="transformations-complete.pdf" download="transformations-complete.pdf">הורדת החוברת להדפסה (PDF, A4)</a></div>
<main class="book" id="book" aria-label="חוברת טרנספורמציות וחפיפת צורות"></main>
<noscript><iframe class="fallback" src="transformations-complete.pdf" title="חוברת טרנספורמציות וחפיפת צורות"></iframe></noscript>
<script>
"use strict";
// Keep the PDF and its real A4 pages as the single source for the reading view.
const PDF = "transformations-complete.pdf";
const BOOK = document.getElementById("book");
const PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.5.438/pdf.min.mjs";
const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.5.438/pdf.worker.min.mjs";
let observer;
let failed = false;

function fallback(error) {
  if (failed) return;
  failed = true;
  if (error) console.error("Unable to render the PDF booklet", error);
  if (observer) observer.disconnect();
  BOOK.replaceChildren();
  const frame = document.createElement("iframe");
  frame.className = "fallback";
  frame.src = PDF;
  frame.title = "חוברת טרנספורמציות וחפיפת צורות";
  BOOK.appendChild(frame);
}

async function show() {
  // A matching, patched PDF.js module and worker are required. No PDF JavaScript eval.
  const pdfjsLib = await import(PDFJS_URL);
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const task = pdfjsLib.getDocument({ url: PDF, disableAutoFetch: true, isEvalSupported: false });
  const load = document.getElementById("load");
  task.onProgress = progress => {
    if (load && progress.total) {
      load.style.width = Math.min(100, 100 * progress.loaded / progress.total) + "%";
    }
  };
  const doc = await task.promise;
  if (!doc.numPages) throw new Error("Empty PDF booklet");
  const firstPage = await doc.getPage(1);
  const firstSize = firstPage.getViewport({ scale: 1 });
  const pages = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const slot = document.createElement("div");
    slot.className = "page";
    slot.id = "page-" + n;
    slot.style.aspectRatio = firstSize.width + " / " + firstSize.height;
    slot.setAttribute("role", "img");
    slot.setAttribute("aria-label", "עמוד " + n);
    BOOK.appendChild(slot);
    pages.push(slot);
  }
  if (load) load.remove();
  if (!("IntersectionObserver" in window)) return fallback(new Error("Unsupported browser"));

  const completed = new WeakMap(); // Only mark a page complete AFTER PDF.js finishes rendering.
  const inflight = new WeakMap();
  const retries = new WeakMap();

  const desiredPixels = slot => {
    const ratio = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    return Math.round(slot.clientWidth * ratio);
  };
  const near = slot => {
    const rect = slot.getBoundingClientRect();
    return rect.bottom >= -1000 && rect.top <= window.innerHeight + 1000;
  };

  async function draw(slot, n) {
    if (failed || !near(slot)) return;
    const pixels = desiredPixels(slot);
    if (!pixels || completed.get(slot) === pixels) return;
    const running = inflight.get(slot);
    if (running) { running.desired = pixels; return; }
    const job = { desired: pixels };
    inflight.set(slot, job);
    try {
      // Don't request/parse all 59 PDF pages just to paint the first visible page.
      const page = n === 1 ? firstPage : await doc.getPage(n);
      const viewport = page.getViewport({ scale: pixels / page.getViewport({ scale: 1 }).width });
      const canvas = document.createElement("canvas");
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      canvas.setAttribute("aria-hidden", "true");
      const ctx = canvas.getContext("2d", { alpha: false });
      if (!ctx) throw new Error("Canvas unavailable");
      await page.render({ canvasContext: ctx, viewport }).promise;
      if (!failed && job.desired === pixels && near(slot)) {
        slot.replaceChildren(canvas);
        completed.set(slot, pixels);
        retries.delete(slot);
      }
    } catch (error) {
      if (!failed && job.desired === pixels && near(slot)) {
        const attempts = (retries.get(slot) || 0) + 1;
        retries.set(slot, attempts);
        if (attempts >= 2) fallback(error);
        else requestAnimationFrame(() => draw(slot, n));
      }
    } finally {
      inflight.delete(slot);
      // Resize/DPR changes during a render must not leave a stale, blurry canvas.
      if (!failed && job.desired !== pixels && near(slot)) {
        requestAnimationFrame(() => draw(slot, n));
      }
    }
  }
  observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      const slot = entry.target;
      const n = Number(slot.id.slice(5));
      if (entry.isIntersecting) {
        void draw(slot, n);
      } else {
        // Canvas bitmaps are large; evict distant pages instead of holding 59 of them.
        slot.replaceChildren();
        completed.delete(slot);
      }
    }
  }, { rootMargin: "1000px 0px" });
  for (const slot of pages) observer.observe(slot);

  const redrawVisible = () => {
    if (failed) return;
    for (let i = 0; i < pages.length; i++) {
      if (near(pages[i])) void draw(pages[i], i + 1);
    }
  };
  window.addEventListener("resize", redrawVisible, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", redrawVisible, { passive: true });
  }
  // Container-width changes may occur without a window resize (e.g. split-screen).
  if (window.ResizeObserver) {
    const resizeObserver = new ResizeObserver(redrawVisible);
    resizeObserver.observe(BOOK);
  }
}
show().catch(fallback);
</script>
</body>
</html>
